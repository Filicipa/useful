name: Docker Artifact

on:
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      SSH_KEY: "${{ secrets.SSH_KEY }}"
      IMAGE_NAME: ${GITHUB_REPOSITORY##*/}
      IMAGE_TAG: ${GITHUB_SHA::7}
      HOST: ${{ secrets.NAME_IP }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Set variables for read it on "actions/upload-artifact@v4" path: ${{ env.IMAGE_NAME }}.tar
      - name: Set environment variables
        run: |
          echo "name=${{ env.IMAGE_NAME }}" >> $GITHUB_ENV
          echo "tag=${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

      - name: Build docker image
        run: docker build . -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Save docker image
        run: docker save -o ${{ env.IMAGE_NAME }}.tar ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - uses: actions/upload-artifact@v4
        with:
          name: docker-artifact
          path: ${{ env.IMAGE_NAME }}.tar

  Deploy:
    runs-on: ubuntu-latest
    needs: [Build]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-artifact
