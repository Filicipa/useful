name: SCRAP_AWS_DEV

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${GITHUB_REPOSITORY#*/}"-dev"
      SSH_KEY: "ssh-key-scrap"
      IMAGE_TAG: ${{ github.sha }}
      HOST: ${{ secrets.DEV_AWS_HOST }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up environment variables
        run: |
          echo "NODE_ENV=${{ vars.DEV_NODE_ENV }}" >> .env
          echo "PORT=${{ vars.DEV_PORT }}" >> .env

      - name: Enable buildx
        run: |
          sudo docker buildx create --use

      - name: Build docker
        run: |
          sudo docker buildx build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} --platform linux/arm/v8 --output type=docker .
      #  --platform linux/amd64,linux/arm64,linux/arm/v8
      - name: Show images
        run: |
          sudo docker images

      - name: Save image
        run: |
          docker save -o ${{ env.IMAGE_NAME }}.tar ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Save secret key
        run: |
          echo "${{ secrets.DEV_AWS_SSH }}" > ${env.SSH_KEY}
          sudo chmod 400 ${env.SSH_KEY}

      - name: Copy image
        run: |
          scp -i ${env.SSH_KEY} -o "StrictHostKeyChecking no" ${{ env.IMAGE_NAME }}.tar ${{ env.HOST }}:${{ env.IMAGE_NAME }}.tar

      - name: Start image
        run: |
          ssh -i ${env.SSH_KEY} -o "StrictHostKeyChecking no" ${{ env.HOST }} ' \
          sudo docker load -i '${{ env.IMAGE_NAME }}'.tar; \
          sudo docker stop '${{ env.IMAGE_NAME }}' || true; \
          sudo docker run --log-driver json-file --log-opt max-size=10m --log-opt max-file=1 -d --restart always \
          -p '${{ vars.DEV_PORT }}':'${{ vars.DEV_PORT }}' --name '${{ env.IMAGE_NAME }}'-new '${{ env.IMAGE_NAME }}':'${{ env.IMAGE_TAG }}'; \
          sudo docker rm '${{ env.IMAGE_NAME }}' || true; sudo docker rmi $(sudo docker images -q) || true; \
          sudo docker rename '${{ env.IMAGE_NAME }}'-new '${{ env.IMAGE_NAME }}'; rm '${{ env.IMAGE_NAME }}'-'${{ env.IMAGE_TAG }}'.tar'
