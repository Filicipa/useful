bind 0.0.0.0
port 0

tls-port 6380

appendonly yes
appendfsync always
no-appendfsync-on-rewrite no

maxmemory-policy noeviction

# "yes" If password is set
protected-mode no

tls-cert-file /certs/redis.crt
tls-key-file /certs/redis.key
tls-ca-cert-file /certs/ca.crt

tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
